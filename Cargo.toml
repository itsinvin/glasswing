[workspace]
resolver = "2"
members = [
    "crates/glasswing-core",
    "crates/glasswing-cli",
    "crates/glasswing-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/itsinvin/glasswing"
authors = ["itsinvin"]

[workspace.dependencies]
glasswing-core = { path = "crates/glasswing-core" }
# Rune: native GPU-rendered Rust UI (wgpu + winit). Pinned to a dev rev because Rune is
# pre-release; `dev` is never rewritten, so this build stays reproducible.
rune = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
dirs = "6"
if-addrs = "0.13"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
# The RP cipher (pairing and session traffic) is AES-128-CFB128 with an
# HMAC-SHA256 IV, and the tables it keys from are Sony's, so the primitives
# themselves come from the well-audited RustCrypto crates.
aes = "0.8"
hmac = "0.12"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"

# Cargo does not inherit `[patch.crates-io]` from a dependency, so the patched crates Rune
# needs are repeated here at the same rev. When Rune is bumped, take this list from Rune's
# own Cargo.toml at that rev.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
naga = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "4918969f04dce020f63b34e024368a86e5e1857d" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true