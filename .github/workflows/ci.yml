name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust core, CLI and app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test core
        run: cargo test -p glasswing-core

      - name: Check core
        run: cargo clippy -p glasswing-core -- -D warnings

      - name: Check CLI
        run: cargo clippy -p glasswing-cli -- -D warnings

      - name: Check app
        run: cargo clippy -p glasswing-app -- -D warnings

      - name: Test app
        run: cargo test -p glasswing-app

      - name: Snapshot the pages
        run: |
          cargo run -p glasswing-app -- --snap target\consoles.png --scene consoles
          cargo run -p glasswing-app -- --snap target\settings.png --scene settings
          cargo run -p glasswing-app -- --snap target\about.png --scene about

      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: page-snapshots
          path: target\*.png
          if-no-files-found: warn